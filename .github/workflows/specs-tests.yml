name: Specs Tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/specs-tests.yml'
  pull_request:
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      ALLOW_BOOT_WITHOUT_KEYS: '1'
      GEMINI_API_KEY: 'placeholder'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run verified-passing specs (per-file isolation)
        # Each spec runs in fresh Python process to avoid fixture-pollution.
        # Allowlist locally verified 2026-05-12 — alla passar 18/18 standalone.
        # Excluded (real bugs tracked in docs/ISSUE_LEDGER):
        #   test_detection_model — 1 failed assertion
        #   test_geocode — 1 fake-client out-of-responses
        #   test_registry_gate — 28 failures (spec-first pending impl)
        run: |
          fails=0
          for f in \
            specs/test_address_match.py \
            specs/test_autonomous_cycle.py \
            specs/test_bootstrap_labels.py \
            specs/test_bulk_csv.py \
            specs/test_bulk_enrich_contacts.py \
            specs/test_detection_escalate.py \
            specs/test_export_csv.py \
            specs/test_gemini_json_parse.py \
            specs/test_gemini_provider.py \
            specs/test_import_labels.py \
            specs/test_improvement_generator.py \
            specs/test_learning_journal.py \
            specs/test_orchestrator_ledger_write.py \
            specs/test_pattern_detector.py \
            specs/test_satellite.py \
            specs/test_scanner.py \
            specs/test_similar_attempts.py \
            specs/test_structured_log.py
          do
            echo "── $f ──"
            pytest "$f" --tb=short -q || fails=$((fails+1))
          done
          if [ "$fails" -gt 0 ]; then
            echo "$fails spec-fil(er) failed"
            exit 1
          fi
      - name: Syntax-check all py-files
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "./__pycache__/*" \
            -exec python -m py_compile {} +
