[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test harnesses + verifier orchestrator legitimately wrap arbitrary stages and
# surface failures via traceback — they ARE the typed-catch layer.
"backend/specs/test_*.py" = ["BLE001"]
"backend/scripts/test_executor_edges.py" = ["BLE001"]
"backend/scripts/verify_v2.py" = ["BLE001"]
"backend/scripts/smoke_*.py" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
