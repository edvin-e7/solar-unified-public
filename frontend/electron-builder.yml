appId: se.edvin.solar-unified
productName: Solprojekt Unified
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business
  icon: build/icon.icns
linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish: null
